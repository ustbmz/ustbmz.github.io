<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanbi Nation — Waitlist</title>
  <meta name="description" content="Lanbi Nation fan app. The app goes live May 22, 2026 — join the waitlist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1A2A5E;
      --orange: #F5A623;
      --ivory: #FAF8F3;
      --dark: #0D1526;
      --muted: rgba(250, 248, 243, 0.72);
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--dark);
      color: var(--ivory);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
      text-align: center;
    }

    .shell-bg {
      position: absolute;
      inset: 0;
      background: url("hero.png") center center / cover no-repeat;
      z-index: 0;
    }

    .shell-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        165deg,
        rgba(13, 21, 38, 0.78) 0%,
        rgba(26, 42, 94, 0.55) 45%,
        rgba(13, 21, 38, 0.94) 100%
      );
      z-index: 1;
    }

    .shell-inner {
      position: relative;
      z-index: 2;
      max-width: 36rem;
      width: 100%;
    }

    .logo {
      width: min(280px, 85vw);
      height: auto;
      margin: 0 auto 1.75rem;
      display: block;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
    }

    .headline {
      font-family: "Barlow Condensed", Inter, sans-serif;
      font-weight: 800;
      font-size: clamp(1.35rem, 4.5vw, 1.85rem);
      line-height: 1.25;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ivory);
      margin-bottom: 1.75rem;
    }

    .headline em {
      font-style: normal;
      color: var(--orange);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      max-width: 22rem;
      margin: 0 auto 1.75rem;
    }

    .cd-item {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(245, 166, 35, 0.35);
      border-radius: 12px;
      padding: 0.65rem 0.35rem;
      backdrop-filter: blur(8px);
    }

    .cd-val {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: clamp(1.5rem, 6vw, 2rem);
      line-height: 1;
      color: var(--orange);
    }

    .cd-label {
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .launch-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      padding: 0.9rem 1.5rem;
      background: var(--orange);
      color: var(--dark);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.35);
    }

    .cta:hover {
      background: #e8960f;
      transform: translateY(-2px);
    }

    .cta:active {
      transform: translateY(0);
    }

    .form-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 0.65rem;
    }

    .waitlist-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 0.75rem;
    }

    .waitlist-form input[type="email"] {
      flex: 1 1 12rem;
      min-width: 0;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1.5px solid rgba(245, 166, 35, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ivory);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .waitlist-form input::placeholder {
      color: rgba(250, 248, 243, 0.45);
    }

    .waitlist-form input:focus {
      border-color: var(--orange);
    }

    .waitlist-form button {
      padding: 0.85rem 1.35rem;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--orange);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border: 2px solid var(--orange);
      transition: background 0.2s, color 0.2s;
    }

    .waitlist-form button:hover {
      background: rgba(245, 166, 35, 0.15);
    }

    .form-hint {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 1rem;
    }

    .form-msg {
      display: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--orange);
      margin-top: 0.5rem;
    }

    .form-msg.visible {
      display: block;
    }

    footer {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    footer a {
      color: var(--orange);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .countdown {
        max-width: 100%;
      }

      .waitlist-form {
        flex-direction: column;
      }

      .waitlist-form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="shell-bg" aria-hidden="true"></div>
    <div class="shell-overlay" aria-hidden="true"></div>

    <div class="shell-inner">
      <img class="logo" src="logo.png" width="560" height="auto" alt="Lanbi Nation">

      <p class="headline">
        The app goes live <em>May 22, 2026</em> — join the waitlist
      </p>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="cd-item">
          <div class="cd-val" id="cd-days">00</div>
          <div class="cd-label">Days</div>
        </div>
        <div class="cd-item">
          <div class="cd-val" id="cd-hours">00</div>
          <div class="cd-label">Hours</div>
        </div>
        <div class="cd-item">
          <div class="cd-val" id="cd-mins">00</div>
          <div class="cd-label">Mins</div>
        </div>
        <div class="cd-item">
          <div class="cd-val" id="cd-secs">00</div>
          <div class="cd-label">Secs</div>
        </div>
      </div>

      <p class="launch-note" id="launch-zone"></p>

      <a class="cta" href="https://lanbination.com" target="_blank" rel="noopener noreferrer">
        Visit lanbination.com
      </a>

      <p class="form-title">Waitlist</p>

      <form class="waitlist-form" id="waitlist-form" method="POST">
        <input type="email" name="email" placeholder="Enter your email" required autocomplete="email" aria-label="Email for waitlist">
        <input type="hidden" name="_subject" value="Lanbi Nation waitlist signup">
        <button type="submit">Notify me</button>
      </form>

      <p class="form-hint">
        Uses Formspree for delivery — set <code style="color:var(--orange)">FORMSPREE_ENDPOINT</code> in the script below (from your <a href="https://formspree.io" target="_blank" rel="noopener noreferrer">Formspree</a> dashboard).
        No spam; unsubscribe anytime.
      </p>
      <p class="form-msg" id="form-msg" role="status"></p>

      <footer>
        <a href="mailto:info@lanbination.com">info@lanbination.com</a>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      /** Full URL from Formspree → Integration → form endpoint, e.g. https://formspree.io/f/abcxyz */
      var FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

      // Launch instant: May 22, 2026, 12:00 noon Eastern Time (America/New_York)
      // May 22, 2026 12:00 noon Eastern Daylight Time (UTC−4)
      var target = new Date("2026-05-22T16:00:00.000Z");
      document.getElementById("launch-zone").textContent =
        "Countdown to May 22, 2026 · 12:00 noon Eastern Time";

      function pad(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function tick() {
        var now = Date.now();
        var ms = target.getTime() - now;
        var el = document.getElementById("countdown");

        if (ms <= 0) {
          document.getElementById("cd-days").textContent = "00";
          document.getElementById("cd-hours").textContent = "00";
          document.getElementById("cd-mins").textContent = "00";
          document.getElementById("cd-secs").textContent = "00";
          if (el) el.setAttribute("aria-label", "Launch time reached");
          return;
        }

        var s = Math.floor(ms / 1000);
        var days = Math.floor(s / 86400);
        s -= days * 86400;
        var hours = Math.floor(s / 3600);
        s -= hours * 3600;
        var mins = Math.floor(s / 60);
        var secs = s - mins * 60;

        document.getElementById("cd-days").textContent = pad(days);
        document.getElementById("cd-hours").textContent = pad(hours);
        document.getElementById("cd-mins").textContent = pad(mins);
        document.getElementById("cd-secs").textContent = pad(secs);
      }

      tick();
      setInterval(tick, 1000);

      var form = document.getElementById("waitlist-form");
      var msg = document.getElementById("form-msg");
      form.action = FORMSPREE_ENDPOINT;
      form.addEventListener("submit", function (e) {
        if (FORMSPREE_ENDPOINT.indexOf("YOUR_FORM_ID") !== -1) {
          e.preventDefault();
          msg.textContent =
            "Set FORMSPREE_ENDPOINT in the page script to your Formspree form URL before going live.";
          msg.classList.add("visible");
        }
      });
    })();
  </script>
</body>
</html>
