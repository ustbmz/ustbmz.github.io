<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lanbi Nation — Waitlist</title>
  <meta name="description" content="Lanbi Nation — The World Cup is coming. Join the waitlist for the fan app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1A2A5E;
      --orange: #F5A623;
      --ivory: #FAF8F3;
      --dark: #0D1526;
      --muted: rgba(250, 248, 243, 0.72);
    }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--dark);
      color: var(--ivory);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .shell {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.25rem 1.5rem 3.25rem;
      text-align: center;
    }

    .shell-bg {
      position: absolute;
      inset: 0;
      background: url("hero.png") center center / cover no-repeat;
      z-index: 0;
    }

    .shell-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        165deg,
        rgba(13, 21, 38, 0.78) 0%,
        rgba(26, 42, 94, 0.55) 45%,
        rgba(13, 21, 38, 0.94) 100%
      );
      z-index: 1;
    }

    .shell-inner {
      position: relative;
      z-index: 2;
      max-width: min(42rem, 100%);
      width: 100%;
    }

    .logo {
      width: min(180px, 58vw);
      height: auto;
      margin: 0 auto 1.35rem;
      display: block;
    }

    .headline {
      font-family: "Barlow Condensed", Inter, sans-serif;
      font-weight: 800;
      font-size: clamp(1.65rem, 5.2vw, 2.65rem);
      line-height: 1.14;
      letter-spacing: 0.02em;
      text-transform: none;
      color: var(--ivory);
      margin-top: clamp(1rem, 3.5vw, 2.25rem);
      margin-bottom: clamp(1.65rem, 4.5vw, 2.5rem);
    }

    .headline em {
      font-style: normal;
      color: var(--orange);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.5rem, 2.2vw, 1.05rem);
      max-width: min(36rem, 100%);
      width: 100%;
      margin: 0 auto clamp(1.75rem, 4.5vw, 2.45rem);
    }

    .cd-item {
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(245, 166, 35, 0.42);
      border-radius: 14px;
      padding: clamp(0.72rem, 2.6vw, 1.15rem) clamp(0.35rem, 1.2vw, 0.65rem);
      backdrop-filter: blur(10px);
      min-width: 0;
    }

    .cd-val {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 800;
      font-size: clamp(1.55rem, 7.5vw, 3.35rem);
      line-height: 0.95;
      color: var(--orange);
    }

    .cd-label {
      font-size: clamp(0.6rem, 1.55vw, 0.72rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: clamp(0.38rem, 1.2vw, 0.52rem);
    }

    .signup-stack {
      width: 100%;
      max-width: min(34rem, 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      margin-top: 0.85rem;
      margin-bottom: 0;
      padding: 0.9rem 1.5rem;
      background: var(--orange);
      color: var(--dark);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 10px;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.35);
    }

    .cta:hover {
      background: #e8960f;
      transform: translateY(-2px);
    }

    .cta:active {
      transform: translateY(0);
    }

    .waitlist-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      align-items: stretch;
      margin-bottom: 0.65rem;
    }

    .waitlist-form input[type="email"] {
      flex: 1 1 12rem;
      min-width: 0;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1.5px solid rgba(245, 166, 35, 0.4);
      background: rgba(255, 255, 255, 0.08);
      color: var(--ivory);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .waitlist-form input::placeholder {
      color: rgba(250, 248, 243, 0.45);
    }

    .waitlist-form input:focus {
      border-color: var(--orange);
    }

    .waitlist-form button {
      padding: 0.85rem 1.35rem;
      border: none;
      border-radius: 10px;
      background: var(--orange);
      color: var(--dark);
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245, 166, 35, 0.35);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .waitlist-form button:hover {
      background: #e8960f;
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(245, 166, 35, 0.42);
    }

    .waitlist-form button:active {
      transform: translateY(0);
    }

    .form-hint {
      font-size: 0.72rem;
      color: rgba(250, 248, 243, 0.52);
      line-height: 1.5;
      margin-top: 0.15rem;
      margin-bottom: 0;
      text-align: center;
    }

    .form-msg {
      display: none;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--orange);
      margin-top: 0;
      margin-bottom: 0.35rem;
      text-align: center;
    }

    .form-msg.visible {
      display: block;
    }

    .footer-note {
      font-size: 0.72rem;
      line-height: 1.5;
      color: rgba(250, 248, 243, 0.5);
      text-align: center;
      max-width: 22rem;
      margin: 2rem auto 0.6rem;
    }

    footer {
      margin-top: 0;
      margin-bottom: 0;
      font-size: 0.72rem;
      color: rgba(250, 248, 243, 0.5);
    }

    footer a {
      color: var(--orange);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    @media (min-width: 560px) {
      .waitlist-form {
        flex-wrap: nowrap;
        gap: 1rem;
      }

      .waitlist-form input[type="email"] {
        flex: 1 1 0;
        min-width: 0;
      }

      .waitlist-form button {
        flex: 0 0 auto;
        white-space: nowrap;
        padding-left: 1.5rem;
        padding-right: 1.5rem;
      }
    }

    @media (max-width: 520px) {
      .countdown {
        max-width: 100%;
        gap: 0.5rem;
      }

      .cd-item {
        border-radius: 11px;
        padding: 0.62rem 0.28rem;
      }

      .waitlist-form {
        flex-direction: column;
        gap: 0.7rem;
      }

      .waitlist-form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="shell-bg" aria-hidden="true"></div>
    <div class="shell-overlay" aria-hidden="true"></div>

    <div class="shell-inner">
      <img class="logo" src="logo.png" width="560" height="auto" alt="Lanbi Nation">

      <p class="headline">
        The World Cup<br>
        <em>Is Coming.</em>
      </p>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="cd-item">
          <div class="cd-val" id="cd-days">00</div>
          <div class="cd-label">Days</div>
        </div>
        <div class="cd-item">
          <div class="cd-val" id="cd-hours">00</div>
          <div class="cd-label">Hours</div>
        </div>
        <div class="cd-item">
          <div class="cd-val" id="cd-mins">00</div>
          <div class="cd-label">Mins</div>
        </div>
        <div class="cd-item">
          <div class="cd-val" id="cd-secs">00</div>
          <div class="cd-label">Secs</div>
        </div>
      </div>

      <div class="signup-stack">
        <form class="waitlist-form" id="waitlist-form" method="POST">
          <input type="email" name="email" placeholder="Enter your email address" required autocomplete="email" aria-label="Email for waitlist">
          <input type="hidden" name="_subject" value="Lanbi Nation waitlist signup">
          <button type="submit">Join waitlist</button>
        </form>

        <p class="form-msg" id="form-msg" role="status"></p>

        <p class="form-hint">
          Free to join. No spam. App launching June 11, 2026.
        </p>

        <a class="cta" href="https://lanbination.com" target="_blank" rel="noopener noreferrer">
          Visit lanbination.com
        </a>
      </div>

      <p class="footer-note">
        We'll only email you about the launch. No spam.
      </p>

      <footer>
        <a href="mailto:info@lanbination.com">info@lanbination.com</a>
      </footer>
    </div>
  </main>

  <script>
    (function () {
      /** Full URL from Formspree → Integration → form endpoint, e.g. https://formspree.io/f/abcxyz */
      var FORMSPREE_ENDPOINT = "https://formspree.io/f/YOUR_FORM_ID";

      // Countdown target: May 22, 2026, 12:00 noon Eastern (EDT, UTC−4)
      var target = new Date("2026-05-22T16:00:00.000Z");

      function pad(n) {
        return n < 10 ? "0" + n : String(n);
      }

      function tick() {
        var now = Date.now();
        var ms = target.getTime() - now;
        var el = document.getElementById("countdown");

        if (ms <= 0) {
          document.getElementById("cd-days").textContent = "00";
          document.getElementById("cd-hours").textContent = "00";
          document.getElementById("cd-mins").textContent = "00";
          document.getElementById("cd-secs").textContent = "00";
          if (el) el.setAttribute("aria-label", "Launch time reached");
          return;
        }

        var s = Math.floor(ms / 1000);
        var days = Math.floor(s / 86400);
        s -= days * 86400;
        var hours = Math.floor(s / 3600);
        s -= hours * 3600;
        var mins = Math.floor(s / 60);
        var secs = s - mins * 60;

        document.getElementById("cd-days").textContent = pad(days);
        document.getElementById("cd-hours").textContent = pad(hours);
        document.getElementById("cd-mins").textContent = pad(mins);
        document.getElementById("cd-secs").textContent = pad(secs);
      }

      tick();
      setInterval(tick, 1000);

      var form = document.getElementById("waitlist-form");
      var msg = document.getElementById("form-msg");
      form.action = FORMSPREE_ENDPOINT;
      form.addEventListener("submit", function (e) {
        if (FORMSPREE_ENDPOINT.indexOf("YOUR_FORM_ID") !== -1) {
          e.preventDefault();
          msg.textContent =
            "Set FORMSPREE_ENDPOINT in the page script to your Formspree form URL before going live.";
          msg.classList.add("visible");
        }
      });
    })();
  </script>
</body>
</html>
